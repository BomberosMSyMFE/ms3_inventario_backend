# ====================================================================
# ESQUEMA GRAPHQL: MS-03 GESTIÓN DE INVENTARIO Y RECURSOS
# Cumple Directiva Punto 03: Gestión Empresarial vs Operativa
# Responsable: Jael Sandoval
# ====================================================================

enum EstadoMaterial {
  DISPONIBLE
  ASIGNADO_CAMION
  EN_DESINFECCION
  VENCIDO
  MANTENIMIENTO_REQUERIDO
  DE_BAJA
}

enum TipoSuministro {
  ESPUMOGENO_AFFF
  RETARDANTE_FORESTAL
  EQUIPO_RESPIRACION_EPP
  MANGUERA_ALTA_PRESION
}

enum CategoriaItem {
  QUIMICO
  EPP
  HERRAMIENTA
}

type SuministroQuimico {
  id: ID!
  codigo: String!
  nombre: String!
  tipo: TipoSuministro!
  litrosDisponibles: Float!
  lote: String!
  fechaCaducidad: String!
}

type KitProteccionEPP {
  id: ID!
  codigo: String!
  presionOxigenoBares: Int!
  esSeguroParaCombate: Boolean!
  estado: EstadoMaterial!
  camionAsignadoId: String
}

type HerramientaEquipo {
  id: ID!
  codigo: String!
  nombre: String!
  tipo: String!
  horasUso: Float!
  umbralFatigaHoras: Float!
  requiereMantenimiento: Boolean!
  estado: EstadoMaterial!
  estacionId: String
}

type MovimientoInventario {
  id: ID!
  tipoMovimiento: String!
  itemCodigo: String!
  itemNombre: String!
  categoria: String!
  cantidad: Float!
  motivo: String!
  responsable: String!
  createdAt: String!
}

type ItemInventarioUnificado {
  id: ID!
  codigo: String!
  nombre: String!
  categoria: CategoriaItem!
  estado: EstadoMaterial!
  stockOVolumen: Float!
  unidadMedida: String!
  detallesExtra: String
  estacionId: String!
  requiereAtencion: Boolean!
}

type TransaccionSagaInfo {
  transaccionId: String!
  incidenteId: String!
  camionId: String!
  kitReservadoId: String
  litrosEspumogenoReservados: Float!
  estado: String!
  createdAt: String!
}

type EstacionInventario {
  estacionId: ID!
  nombreEstacion: String!
  kitsDisponibles: [KitProteccionEPP!]!
  suministrosQuimicos: [SuministroQuimico!]!
}

type ResumenKpis {
  totalKits: Int!
  kitsSeguros: Int!
  totalQuimicosLitros: Float!
  totalHerramientas: Int!
  equiposMantenimiento: Int!
  reservasActivas: Int!
}

# Payload transaccional para la SAGA de Nataly
type ReservaPayload {
  exito: Boolean!
  transaccionId: String!
  codigoError: String
  mensaje: String!
  materialesReservados: [String!]!
}

type LiberacionPayload {
  exito: Boolean!
  mensaje: String!
}

type MutationResponse {
  exito: Boolean!
  mensaje: String!
  itemCodigo: String
}

type Query {
  # Contrato 1: Resuelve Over-fetching en el panel administrativo
  auditoriaStockGeneral(estacionId: ID): [SuministroQuimico!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@auditoriaStockGeneral")

  # Contrato 2: Resuelve N+1 Under-fetching (Vista combinada de una estación)
  obtenerInventarioEstacion(estacionId: ID!): EstacionInventario
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@obtenerInventarioEstacion")

  # Contrato 3: Verificación individual de un Kit
  consultarKitEPP(codigo: String!): KitProteccionEPP
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@consultarKitEPP")

  # Queries Logísticas Avanzadas para Jefa de Logística
  resumenDashboardLogistica: ResumenKpis!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@resumenDashboardLogistica")

  listarInventarioGeneral(categoria: String, estado: String): [ItemInventarioUnificado!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@listarInventarioGeneral")

  listarHerramientas(estacionId: ID): [HerramientaEquipo!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@listarHerramientas")

  listarEquiposMantenimiento: [ItemInventarioUnificado!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@listarEquiposMantenimiento")

  listarMovimientos(limite: Int): [MovimientoInventario!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@listarMovimientos")

  listarTransaccionesSaga(estado: String): [TransaccionSagaInfo!]!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@listarTransaccionesSaga")
}

type Mutation {
  # Mutación Transaccional SAGA: Invocada por MS-01 durante el despacho
  reservarKitParaDespacho(
    incidenteId: ID!
    camionId: String!
    litrosEspumogeno: Float!
  ): ReservaPayload!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@reservarKitParaDespacho")

  # Mutación Compensatoria SAGA: Si falla la reserva de camión en MS-02
  liberarReservaCompensatoria(
    transaccionId: String!
  ): LiberacionPayload!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@liberarReservaCompensatoria")

  # Mutaciones CRUD Dinámicas para Gestión de Almacén
  registrarInsumoQuimico(
    codigo: String!
    nombre: String!
    tipo: TipoSuministro!
    litrosDisponibles: Float!
    lote: String!
    fechaCaducidad: String!
    estacionId: ID
  ): SuministroQuimico!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@registrarInsumoQuimico")

  registrarKitEPP(
    codigo: String!
    presionOxigenoBares: Int!
    estacionId: ID
  ): KitProteccionEPP!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@registrarKitEPP")

  registrarHerramienta(
    codigo: String!
    nombre: String!
    tipo: String!
    horasUso: Float!
    umbralFatigaHoras: Float!
    estacionId: ID
  ): HerramientaEquipo!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@registrarHerramienta")

  registrarMovimientoStock(
    itemCodigo: String!
    tipoMovimiento: String!
    cantidad: Float!
    motivo: String!
    responsable: String
  ): MutationResponse!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@registrarMovimientoStock")

  actualizarHorasUsoHerramienta(
    codigo: String!
    horasAdicionales: Float!
  ): HerramientaEquipo!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@actualizarHorasUsoHerramienta")

  cambiarEstadoItem(
    codigo: String!
    categoria: CategoriaItem!
    nuevoEstado: EstadoMaterial!
  ): MutationResponse!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@cambiarEstadoItem")

  retornarDeMantenimiento(
    codigo: String!
    categoria: CategoriaItem!
    nuevaPresion: Int
    reiniciarHoras: Boolean
  ): MutationResponse!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@retornarDeMantenimiento")

  # Automatización n8n: Emisión de Alerta de Quiebre de Stock Crítico
  emitirAlertaQuiebreStockN8n(
    codigo: String!
  ): MutationResponse!
    @field(resolver: "App\\Inventario\\Infrastructure\\GraphQL\\Resolvers\\SuministrosResolver@emitirAlertaQuiebreStockN8n")
}
